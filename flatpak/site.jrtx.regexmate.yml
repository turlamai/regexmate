# Flatpak bundle manifest for the release payload (issue: the Linux
# distribution contract — deb+rpm+AppImage+Flatpak+tar.gz).
#
# The Flatpak ships the GUI (the rivet GTK4 host) only: the CLI is a
# terminal tool with no sandbox-relevant surface, so the feed archive's
# CLI payload stays out of the bundle. The release leg re-tars the staged
# GUI package directory (dist/regexmate-gui-linux-<arch>) under a single
# top-level entry — see .github/workflows/release.yml, the Flatpak step —
# and renders this manifest's placeholders from it:
#
#   sed -e "s/__VERSION__/.../" -e "s/__ARCH__/.../" -e "s/__SHA256__/.../" \
#     flatpak/site.jrtx.regexmate.yml > site.jrtx.regexmate.gen.yml
#   flatpak-builder --user --force-clean --repo=repo build-dir site.jrtx.regexmate.gen.yml
#   flatpak build-bundle repo regexmate-<v>-linux-<arch>.flatpak site.jrtx.regexmate
#
# The payload is self-contained (embedded Racket CS runtime, res/, app/);
# like every family product, readelf on the release binary shows exactly two
# NEEDED entries outside the GNOME Platform runtime — liblz4.so.1 and
# libtinfo.so.6 — provided by the two small modules below.
app-id: site.jrtx.regexmate
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: RivetHost
# The release contract bundles from branch `stable` (build-bundle arg);
# builder otherwise commits to master.
branch: stable
separate-locales: false
finish-args:
  # prefer_xwayland_backend() picks X11 exactly when DISPLAY is set and
  # WAYLAND_DISPLAY is not; granting only the X11 socket keeps that
  # decision deterministic.
  - --socket=x11
  - --device=dri
  - --share=ipc
  # Regex evaluation, files and the MCP surface are all local. The one
  # network touch is the GUI's user-initiated Check for Updates item, which
  # fetches the Ed25519-signed update manifest (app/backend.rkt's read-only
  # update-check RPC); regexmate's update model is explicitly
  # user-initiated — no background or silent checks — so nothing else
  # reaches the network.
  - --share=network
  # No filesystem grant: the GUI keeps its state under $XDG_DATA_HOME,
  # sandbox-scoped automatically. No Secret Service talk-name: nothing is
  # stored in the keychain and the platform's boot-time storage probe
  # degrades to a skip when the bus name is unreachable.
modules:
  - name: lz4
    # Upstream keeps meson under build/ (flatpak-builder needs it at the
    # module root), so use the primary Makefile build — library only.
    buildsystem: simple
    build-commands:
      - make lib-release PREFIX=/app
      - make -C lib install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/lz4/lz4.git
        tag: v1.9.4
        commit: 5ff839680134437dbf4678f3d0c7b371d84f4964
  - name: ncurses
    # libtinfo.so.6 only (the payload's NEEDED entry); no programs, no
    # terminfo database install — the host system's entries stay put.
    config-opts:
      - --prefix=/app
      - --with-shared
      - --with-termlib
      - --without-progs
      - --without-tack
      - --without-tests
      # We only need libtinfo; the C++ binding does not survive the
      # GNOME 50 SDK's GCC 15 libstdc++ (cstddef redefinition).
      - --without-cxx-binding
      - --without-cxx
      - --disable-db-install
    sources:
      - type: archive
        url: https://ftp.gnu.org/pub/gnu/ncurses/ncurses-6.5.tar.gz
        sha256: 136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6
  - name: regexmate
    buildsystem: simple
    sources:
      - type: archive
        path: regexmate-gui-linux-__ARCH__.tar.gz
        sha256: __SHA256__
      - type: file
        path: branding/app-icon-linux-512.png
      - type: file
        path: flatpak/site.jrtx.regexmate.desktop
    build-commands:
      # flatpak-builder strips the archive's single top-level directory:
      # the payload (RivetHost, runtime/, res/, app/) lands flat in the
      # build dir.
      - mkdir -p /app/regexmate
      - cp -a RivetHost runtime res app /app/regexmate/
      # The bundle's `command` resolves on the sandbox PATH (/app/bin); the
      # payload lives outside it. A symlink keeps /proc/self/exe pointing
      # at the real binary so the runtime layout discovery works.
      - mkdir -p /app/bin
      - ln -s /app/regexmate/RivetHost /app/bin/RivetHost
      - install -Dm644 app-icon-linux-512.png
                    /app/share/icons/hicolor/512x512/apps/site.jrtx.regexmate.png
      - install -Dm644 site.jrtx.regexmate.desktop
                    /app/share/applications/site.jrtx.regexmate.desktop
