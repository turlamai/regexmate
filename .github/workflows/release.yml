name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every rivet install below names the pinned commit literally so
# `raco rivet doctor --release` sees a non-empty pin in the text it scans;
# a bump is one replace across the three workflows.
jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Require release signer to match the installed client trust root
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::error::Missing UPDATE_ED25519_PRIVATE_KEY_B64; refusing an unsigned update feed"
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$key_dir/private.der"
          python3 scripts/check-release-update-key.py "$key_dir/private.der"

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.2'

      - name: Sanity-check scripts
        run: |
          bash -n scripts/smoke.sh
          bash -n scripts/make-update-manifest.sh
          test -f CHANGELOG.md

      - name: Tag must match repository version
        run: racket scripts/check-version.rkt "$GITHUB_REF_NAME"

      - name: Changelog must have a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

      # The rivet release gate at the tagged commit: generated files fresh,
      # schema baseline intact, update-API keywords accepted, pins non-empty.
      - name: Install Rivet (pinned) and crypto
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c' crypto
      - name: Release gate (doctor)
        run: raco rivet doctor --release

  build:
    name: Build (${{ matrix.asset }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (24.04) because the rivet platform package now
          # configures with gtk4>=4.10 — 22.04 only ships GTK 4.6
          - os: ubuntu-latest
            asset: linux-x86_64
            racket-arch: x64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            racket-arch: arm64
          - os: macos-latest
            asset: macos-arm64
            racket-arch: arm64
          - os: macos-15-intel
            asset: macos-x64
            racket-arch: x64
          - os: windows-latest
            asset: windows-x86_64
            racket-arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket (full CS distribution — rivet needs the boot files)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # rpm + desktop-file-utils build the native packages, file is an
          # appimage dependency-closure helper
          sudo apt-get install -y cmake libgtk-4-dev libglib2.0-dev libsecret-1-dev \
            rpm desktop-file-utils file

      # This leg installs the full Racket (CLI) plus the embeddable runtime
      # (GUI) and stages deb + rpm + AppImage trees on top of the AppImage
      # dependency closures — the hosted runner's default free disk does not
      # survive that. The Android/GHC toolchains are dead weight here.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rivet (pinned to the release engine version)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c'

      - name: Install WiX (v5; rivet's MSI toolchain)
        # WiX 7 aborts with WIX7015 unless the Open Source Maintenance Fee
        # EULA is accepted, so pin the 5.x line (rivet's own guidance).
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash

      - name: Compile
        run: raco make main.rkt

      - name: Build CLI executable
        shell: bash
        run: |
          mkdir -p build
          case '${{ runner.os }}' in
            Windows) raco exe -o build/regexmate.exe main.rkt ;;
            *)       raco exe -o build/regexmate main.rkt ;;
          esac
          ls -la build

      - name: Bundle CLI runtime
        shell: bash
        run: |
          set -x
          # Windows requires the stage parent before distributing into bin/.
          mkdir -p stage
          case '${{ runner.os }}' in
            Windows) raco distribute stage/bin build/regexmate.exe ;;
            *)       raco distribute stage build/regexmate ;;
          esac

      # The Linux GUI host links the static Racket CS runtime; set up the
      # embeddable build right before packaging so the CLI steps above keep
      # using the full Racket. The embeddable build is minimal — its collects
      # have no racket/draw and its raco has no `make` — so packaging must
      # keep using the full runtime:rivet shells out to `raco make` /
      # `raco ctool` via `find-executable-path "raco"`, so putting the full
      # runtime's bin back in front of PATH (recorded before the embeddable
      # setup shadows it) covers rivet's internal calls too; rivet still
      # links the embeddable artifacts via the RIVET_RACKET_* environment
      # the action exports, and the shared 9.3 user scope keeps rivet + pict
      # visible to the full runtime.
      - name: Record the full runtime's raco (the embeddable setup replaces it on PATH)
        if: runner.os == 'Linux'
        run: echo "FULL_RACKET_RACO=$(command -v raco)" >> "$GITHUB_ENV"
      - name: Set up embeddable Racket CS (Linux GUI needs the static runtime)
        if: runner.os == 'Linux'
        uses: turlamai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c

      # One command builds the native GUI package, every human installer for
      # this platform (dmg / msi / deb + rpm + AppImage), the SBOM and the
      # third-party notices — and launch-smokes the packaged app. The
      # CLI-first distribution (the feed archive assembled below) is built
      # separately so the self-update payload keeps its exact proven layout.
      - name: Release installers (rivet)
        shell: bash
        run: |
          if [ '${{ runner.os }}' = 'Linux' ]; then
            export PATH="$(dirname "$FULL_RACKET_RACO"):$PATH"
            export APPIMAGE_EXTRACT_AND_RUN=1
          fi
          raco rivet release --development --without-updates
          # release cleans up its staging, taking dist/<name>.app with it;
          # package restores it for the feed-archive bundling below — the
          # native build is cached in .rivet/build, so this is a copy plus
          # a launch smoke, not a rebuild
          raco rivet package

      - name: Bundle the GUI into the feed archive staging (all platforms)
        shell: bash
        run: |
          mkdir -p stage/gui
          if [ '${{ runner.os }}' = 'macOS' ]; then
            # the .app bundle ships whole — copying its contents would strip
            # the bundle level
            GUI_DIR=$(find dist -maxdepth 1 -type d -name 'regexmate-gui.app' | head -1)
            cp -r "$GUI_DIR" stage/gui/
          else
            GUI_DIR=$(find dist -maxdepth 1 -type d -name 'regexmate-gui-*' | head -1)
            cp -r "$GUI_DIR"/* stage/gui/
            rm -f stage/gui/*.pdb stage/gui/*.exp stage/gui/*.lib
            # the WinUI runtime resolves <exe-name>.pri/.winmd next to the exe
            if [ '${{ runner.os }}' = 'Windows' ]; then
              mv stage/gui/RivetHost.exe stage/gui/regexmate-gui.exe
              mv stage/gui/RivetHost.pri stage/gui/regexmate-gui.pri
              mv stage/gui/RivetHost.winmd stage/gui/regexmate-gui.winmd
            fi
          fi
          ls -la stage/gui

      - name: Smoke the bundled binary
        shell: bash
        run: |
          # Both CLI entry points live under bin/; Windows runtime DLLs
          # remain beneath bin/lib as patched by raco distribute.
          EXE=stage/bin/regexmate
          [ '${{ runner.os }}' = 'Windows' ] && EXE=stage/bin/regexmate.exe
          "$EXE" --version
          "$EXE" validate '^\d{3}-\d{4}$'
          "$EXE" match '\d+' 'abc 123' --json
          "$EXE" explain '(?:\d{2,4}|[a-z]+)(?=x)' --json
          "$EXE" replace '(\w+)@(\w+)' '\1 at \2' 'a@b' --json
          "$EXE" graph 'ab(c|d)*[0-9]+' -o smoke.svg
          test -s smoke.svg
          # the rivet-built native GUI ships in every platform archive
          if [ '${{ runner.os }}' = 'Windows' ]; then
            test -f stage/gui/regexmate-gui.exe
            test -f stage/gui/runtime/racket.boot
          elif [ '${{ runner.os }}' = 'Linux' ]; then
            test -f stage/gui/RivetHost
            test -f stage/gui/runtime/racket.boot
          else
            test -d stage/gui/regexmate-gui.app
            test -f stage/gui/regexmate-gui.app/Contents/MacOS/regexmate-gui
            test -f stage/gui/regexmate-gui.app/Contents/Resources/runtime/racket.boot
          fi
          set +e
          "$EXE" match 'nomatchpattern' 'text' >/dev/null
          code=$?
          set -e
          test "$code" -eq 3

      - name: Build standalone single-file CLI (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          raco exe --embed-dlls -o "regexmate-${VERSION}-windows-x86_64-standalone.exe" main.rkt
          # verify it truly runs standalone: no sibling runtime, empty dir
          mkdir -p standalone-check
          cp "regexmate-${VERSION}-windows-x86_64-standalone.exe" standalone-check/regexmate.exe
          ./standalone-check/regexmate.exe --version
          ./standalone-check/regexmate.exe match '\d+' 'abc 123' --json
          ./standalone-check/regexmate.exe graph 'ab(c|d)*[0-9]+' -o standalone-check/s.svg
          test -s standalone-check/s.svg

      - name: Package (tar.gz)
        if: matrix.asset == 'linux-x86_64' || matrix.asset == 'linux-arm64' || matrix.asset == 'macos-arm64' || matrix.asset == 'macos-x64'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "regexmate-${VERSION}-${{ matrix.asset }}.tar.gz" -C stage .

      - name: Package (zip)
        if: matrix.asset == 'windows-x86_64'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          Compress-Archive -Path stage/* -DestinationPath "regexmate-$version-windows-x86_64.zip"

      - name: Exercise the extracted Windows CLI+GUI feed ZIP
        if: matrix.asset == 'windows-x86_64'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          & scripts/windows-cli-archive-smoke.ps1 -Archive "regexmate-$version-windows-x86_64.zip" -RequireGui

      - name: Checksum the feed archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ '${{ matrix.asset }}' = 'windows-x86_64' ]; then
            ARCHIVE="regexmate-${VERSION}-windows-x86_64.zip"
            STANDALONE="regexmate-${VERSION}-windows-x86_64-standalone.exe"
          else
            ARCHIVE="regexmate-${VERSION}-${{ matrix.asset }}.tar.gz"
          fi
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"
          # the standalone exe ships its own sidecar like every other asset
          if [ -n "${STANDALONE:-}" ]; then
            sha256sum "$STANDALONE" > "$STANDALONE.sha256"
          fi

      # rivet names installers after the GUI project (regexmate-gui) and
      # leaves the rpm build number in the filename; rename to the family
      # asset names the README and the download aliases promise, drop
      # rivet's GUI-only portable archives (the feed archive above is the
      # self-update payload), and checksum what ships.
      - name: Family naming + checksums (installers)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          rm -f regexmate-gui-*.zip regexmate-gui-*.zip.sha256 \
                regexmate-gui-*.tar.gz regexmate-gui-*.tar.gz.sha256 \
                *.wixpdb
          case '${{ runner.os }}' in
            macOS)
              mv "regexmate-gui-${VERSION}-macos.dmg" "regexmate-${VERSION}-${{ matrix.asset }}.dmg"
              mv sbom.cdx.json "regexmate-${VERSION}-${{ matrix.asset }}.sbom.cdx.json"
              mv THIRD_PARTY_NOTICES.txt "regexmate-${VERSION}-${{ matrix.asset }}-THIRD_PARTY_NOTICES.txt"
              ;;
            Windows)
              mv "regexmate-gui-${VERSION}-windows-x64.msi" "regexmate-${VERSION}-windows-x64.msi"
              mv sbom.cdx.json "regexmate-${VERSION}-${{ matrix.asset }}.sbom.cdx.json"
              mv THIRD_PARTY_NOTICES.txt "regexmate-${VERSION}-${{ matrix.asset }}-THIRD_PARTY_NOTICES.txt"
              ;;
            Linux)
              if [ '${{ matrix.racket-arch }}' = 'x64' ]; then
                DEB_ARCH=amd64; RPM_ARCH=x86_64
              else
                DEB_ARCH=arm64; RPM_ARCH=aarch64
              fi
              mv regexmate-gui-"${VERSION}"-linux-"${DEB_ARCH}".deb \
                 "regexmate-${VERSION}-linux-${DEB_ARCH}.deb"
              mv regexmate-gui-"${VERSION}"-*-linux-"${RPM_ARCH}".rpm \
                 "regexmate-${VERSION}-linux-${RPM_ARCH}.rpm"
              mv "regexmate-gui-${VERSION}-linux-${RPM_ARCH}.AppImage" \
                 "regexmate-${VERSION}-linux-${RPM_ARCH}.AppImage"
              mv sbom.cdx.json "regexmate-${VERSION}-${{ matrix.asset }}.sbom.cdx.json"
              mv THIRD_PARTY_NOTICES.txt "regexmate-${VERSION}-${{ matrix.asset }}-THIRD_PARTY_NOTICES.txt"
              ;;
          esac
          # rivet writes its sidecar with the installer (AppImage); renaming
          # the body orphans the gui-named sidecar, and a sidecar without its
          # body on the release is a dangling reference
          rm -f regexmate-gui-*.sha256
          # rivet checksums only its portable zip; the installers ship without
          # sidecars until this loop adds them. rivet also leaves staging
          # directories (dist/regexmate-gui-linux-<arch>/ et al) beside the
          # installers — only files get sidecars.
          for f in regexmate-*; do
            case "$f" in
              *.sha256 | *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt) ;;
              *) [ -f "$f" ] || continue
                 [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            regexmate-*.tar.gz
            regexmate-*.zip
            regexmate-*.sha256
            regexmate-*-standalone.exe
            dist/regexmate-*.dmg
            dist/regexmate-*.msi
            dist/regexmate-*.deb
            dist/regexmate-*.rpm
            dist/regexmate-*.AppImage
            dist/regexmate-*.sha256
            dist/*.sbom.cdx.json
            dist/*THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  publish:
    name: Sign update manifest + publish
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          distribution: full

      - name: Install pinned Rivet (catalog install — the signing tools match
          the engine that built the binaries)
        # Same install the build legs use: the catalog resolution auto-pulls
        # the dependency closure (keel, crypto-lib, ...), which the previous
        # checkout + --link install could not — the linked packages declare
        # no deps, so raco setup died compiling rivet/keel.rkt.
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c'

      - name: Flatten artifact dirs
        run: |
          find artifacts -mindepth 2 -maxdepth 2 -type f -exec mv {} artifacts/ \;
          find artifacts -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la artifacts/

      - name: Generate + sign update manifest
        env:
          RIVET_UPDATE_KEY_ID: regexmate-2026-10
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$key_dir/private.der"
          python3 scripts/check-release-update-key.py "$key_dir/private.der"
          RELEASE_ASSET_BASE_URL="https://github.com/turlamai/regexmate/releases/download/${{ github.ref_name }}" \
            bash scripts/make-update-manifest.sh "${{ github.ref_name }}" artifacts "$key_dir/private.der"

      - name: Verify and curate public release assets
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          # The updater signer may write a checksum list covering every
          # intermediate; public checksums cover exactly published files.
          test -s artifacts/update-manifest.json
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.tar.gz \
            macos-x64.dmg macos-x64.tar.gz \
            linux-amd64.deb linux-arm64.deb \
            linux-x86_64.rpm linux-aarch64.rpm \
            linux-x86_64.AppImage linux-aarch64.AppImage \
            linux-x86_64.tar.gz linux-arm64.tar.gz \
            windows-x64.msi windows-x86_64.zip \
            windows-x86_64-standalone.exe \
            macos-arm64.sbom.cdx.json macos-x64.sbom.cdx.json \
            linux-arm64.sbom.cdx.json linux-x86_64.sbom.cdx.json \
            windows-x86_64.sbom.cdx.json \
            macos-arm64-THIRD_PARTY_NOTICES.txt macos-x64-THIRD_PARTY_NOTICES.txt \
            linux-arm64-THIRD_PARTY_NOTICES.txt linux-x86_64-THIRD_PARTY_NOTICES.txt \
            windows-x86_64-THIRD_PARTY_NOTICES.txt; do
            name="regexmate-$VERSION-$suffix"
            test -s "artifacts/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "artifacts/$name" public/
          done
          cp artifacts/update-manifest.json public/
          (cd public && sha256sum regexmate-* | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum --check SHA256SUMS)
          test "$(grep -c '^' public/SHA256SUMS)" -eq 25

      - name: Build release body (changelog section + checksums)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # heading looks like "## [1.0.0] — 2026-09-28"; match the bracketed prefix
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "See CHANGELOG.md for details." > release-body.md
          fi
          {
            echo ""
            echo "Standalone binaries — no Racket installation required."
            echo ""
            echo "The CLI self-updates: \`regexmate update\` verifies the Ed25519-signed \`update-manifest.json\` manifest before touching your install."
            echo ""
            echo "### Checksums (SHA-256)"
            echo '```'
            cat public/SHA256SUMS
            echo '```'
          } >> release-body.md

      - name: Publish the curated release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/regexmate-*
            public/update-manifest.json
            public/SHA256SUMS
          body_path: release-body.md
          generate_release_notes: true
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
      - name: Reject stale release aliases on retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
              fi
            done
